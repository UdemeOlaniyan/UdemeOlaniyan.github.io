<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPRM — A Major Healthcare Organization & a national retail corporation — Walkthrough</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg: #0c0d0f; --panel: #181c22; --border: #2a3040; --surface: #131519;
    --gold: #c9a84c; --gold-dim: rgba(201,168,76,0.15);
    --accent: #4a7fe8;
    --accent-dim: #4a7fe822;
    --text: #edeae0; --muted: #7a8090;
    --headline: 'Syne', sans-serif; --body: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(201,168,76,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.02) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  /* TOP BAR */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(12,13,15,0.94); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .back-btn {
    color: var(--gold); text-decoration: none; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3);
    padding: 4px 12px; border-radius: 20px; transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(201,168,76,0.25); }
  .topbar-title { font-family: var(--headline); font-size: 14px; font-weight: 700; color: var(--text); }
  .topbar-sub { font-size: 11px; color: var(--muted); }
  .week-counter { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--accent); }

  /* PROGRESS BAR */
  .progress-bar {
    position: fixed; top: 56px; left: 0; right: 0; z-index: 99;
    height: 3px; background: var(--border);
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent));
    transition: width 0.4s ease;
  }

  /* WEEK DOTS */
  .week-dots {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 100;
    background: rgba(12,13,15,0.8); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 30px; backdrop-filter: blur(10px);
  }
  .dot {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: var(--muted); cursor: pointer;
    transition: all 0.2s; font-family: var(--headline);
  }
  .dot.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .dot:hover { border-color: var(--accent); color: var(--accent); }

  /* SLIDE */
  .slide-wrap { padding: 80px 32px 100px; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
  .slide { max-width: 900px; width: 100%; position: relative; z-index: 1; }

  /* WEEK HEADER */
  .week-header { margin-bottom: 36px; }
  .week-badge {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px;
    background: var(--accent-dim); border: 1px solid var(--accent)55;
    color: var(--accent); padding: 5px 14px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .week-title { font-family: var(--headline); font-size: clamp(26px,4vw,42px); font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 10px; color: var(--text); }
  .week-goal {
    font-size: 15px; color: #b8a87a; font-style: italic; line-height: 1.6;
    border-left: 2px solid var(--gold); padding-left: 14px; max-width: 680px;
  }

  /* CONTENT GRID */
  .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .content-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; position: relative; overflow: hidden;
  }
  .content-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--gold), var(--accent)); }
  .card-label { font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .task-list { list-style: none; }
  .task-list li { font-size: 13px; color: var(--muted); padding: 7px 0; border-bottom: 1px solid rgba(42,48,64,0.5); line-height: 1.5; display: flex; align-items: flex-start; gap: 8px; }
  .task-list li:last-child { border-bottom: none; }
  .task-list li::before { content: '›'; color: var(--accent); font-size: 16px; font-weight: 700; flex-shrink: 0; margin-top: -1px; }

  .deliverable { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(42,48,64,0.5); font-size: 13px; color: var(--muted); line-height: 1.5; }
  .deliverable:last-child { border-bottom: none; }
  .check { font-size: 14px; flex-shrink: 0; }

  /* META BAR */
  .meta-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 20px; display: flex; gap: 24px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
  }
  .meta-item { display: flex; align-items: center; gap: 8px; }
  .meta-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .meta-value { font-size: 12px; color: var(--text); font-weight: 600; }
  .meta-chip { background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3); color: var(--gold); padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }

  /* NAV ARROWS */
  .nav-arrows { display: flex; gap: 12px; margin-top: 32px; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    font-family: var(--body); transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn.primary { background: var(--gold-dim); border-color: rgba(201,168,76,0.4); color: var(--gold); }
  .nav-btn.primary:hover { background: rgba(201,168,76,0.25); }

  /* INTRO SLIDE */
  .intro-slide { text-align: center; padding: 48px 0; }
  .intro-badge {
    display: inline-block; margin-bottom: 24px;
    background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.35); color: var(--gold);
    padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .intro-title { font-family: var(--headline); font-size: clamp(32px,5vw,56px); font-weight: 800; letter-spacing: -2px; line-height: 1.05; margin-bottom: 16px;
    background: linear-gradient(135deg, #edeae0 0%, #c9a84c 50%, #4a7fe8 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .intro-sub { font-size: 16px; color: var(--muted); max-width: 560px; margin: 0 auto 32px; line-height: 1.7; }
  .intro-chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 36px; }
  .intro-chip { background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .intro-weeks { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; max-width: 640px; margin: 0 auto 36px; }
  .intro-week { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: left; cursor: pointer; transition: border-color 0.2s; }
  .intro-week:hover { border-color: var(--gold); }
  .intro-week-num { font-size: 10px; color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .intro-week-title { font-size: 12px; color: var(--text); font-weight: 600; }
  .start-btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px;
    background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.4); color: var(--gold);
    border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: var(--body); transition: all 0.2s; text-decoration: none;
  }
  .start-btn:hover { background: rgba(201,168,76,0.25); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-btn">&#x2190; Portfolio</a>
    <div>
      <div class="topbar-title">TPRM — A Major Healthcare Organization & a national retail corporation</div>
      <div class="topbar-sub">TPRM / HIPAA / PCI DSS &middot; A Major Healthcare Organization & a national retail corporation</div>
    </div>
  </div>
  <div class="week-counter" id="weekCounter">Overview</div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="slide-wrap" id="slideWrap">
  <div class="slide" id="slideContent">
    <!-- rendered by JS -->
  </div>
</div>

<div class="week-dots" id="weekDots"></div>

<script>
const TITLE = 'TPRM — A Major Healthcare Organization & a national retail corporation';
const SUBTITLE = 'Third-Party Risk Management across healthcare (HIPAA/HITRUST) and retail (PCI DSS/ISO 27001) vendor ecosystems';
const FRAMEWORK = 'TPRM / HIPAA / PCI DSS';
const COMPANY = 'A Major Healthcare Organization & a national retail corporation';
const SECTOR = 'Healthcare & Retail';

const weeks = [{
  num: 1,
  title: 'Initiation — Understanding the Vendor Ecosystems',
  goal: 'Define the scope and vendor landscape for both A Major Healthcare Organization and a national retail corporation.',
  tasks: `<li>A Major Healthcare Organization: Review HIPAA Privacy & Security Rule obligations, patient safety priorities, and vendor management policies. Identify 10 strategic healthcare vendors (Epic EHR, AWS/Azure, medical device vendors, telehealth platforms, revenue cycle vendors)</li><li>a national retail corporation: Review Vendor Code of Conduct, PCI DSS compliance objectives, GDPR/CCPA obligations. Identify 10 strategic vendors (cloud providers, POS systems, payment processors, logistics partners, marketing platforms)</li><li>Map regulatory obligations: A Major Healthcare Organization → HIPAA, HITECH, HITRUST, NIST 800-53; a national retail corporation → PCI DSS, GDPR, CCPA, ISO 27001</li><li>Identify internal stakeholders for both organizations: Information Security, Compliance, IT, Clinical Ops (Hopkins) / Procurement, Supply Chain (a national retail corporation)</li><li>Document vendor inventory spreadsheets and stakeholder/regulatory summaries for both organizations</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>Vendor Inventory Spreadsheet — A Major Healthcare Organization (10 vendors)</div><div class="deliverable"><span class="check">&#x2705;</span>Vendor Inventory Spreadsheet — a national retail corporation (10 vendors)</div><div class="deliverable"><span class="check">&#x2705;</span>Stakeholder & Regulatory Summary (both organizations)</div>`
},
{
  num: 2,
  title: 'Planning — Scope, Roles & Vendor Prioritization',
  goal: 'Define assessment scope, build RACI charts, and classify vendors by risk.',
  tasks: `<li>Create TPRM Project Charter for A Major Healthcare Organization: scope healthcare vendors handling ePHI, clinical systems, cloud platforms, medical devices</li><li>Create TPRM Project Charter for a national retail corporation: scope payment, logistics, SaaS, and marketing vendors across retail supply chain</li><li>Classify vendors by risk tier — A Major Healthcare Organization: High (EHR, cloud, billing), Medium (medical devices, labs), Low (non-IT vendors); a national retail corporation: High (payment processors), Medium (logistics), Low (marketing)</li><li>Map vendor types to compliance frameworks: Hopkins vendors → HIPAA/HITRUST/NIST; a national retail corporation vendors → PCI DSS/ISO 27001/NIST</li><li>Build RACI charts for both organizations covering GRC, Compliance, IT, Procurement, and operational teams</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>Project Charter — A Major Healthcare Organization TPRM</div><div class="deliverable"><span class="check">&#x2705;</span>Project Charter — Retail Organization TPRM</div><div class="deliverable"><span class="check">&#x2705;</span>Vendor Criticality Matrix (both organizations)</div><div class="deliverable"><span class="check">&#x2705;</span>RACI Charts (both organizations)</div>`
},
{
  num: 3,
  title: 'Execution Part 1 — Due Diligence Assessments',
  goal: 'Perform healthcare and retail-specific vendor risk assessments.',
  tasks: `<li>Develop A Major Healthcare Organization Healthcare Vendor Questionnaire: HIPAA safeguards, ePHI encryption, breach notification timelines, MFA controls, medical device security, BAA status</li><li>Develop a national retail corporation Retail Vendor Questionnaire: PCI DSS controls, cloud security posture, incident response, payment data handling, cardholder data access controls</li><li>Simulate vendor responses from: Hopkins (cloud hosting vendor, medical device manufacturer, billing vendor); a national retail corporation (payment gateway, cloud SaaS partner, logistics provider)</li><li>Review compliance evidence: Hopkins (SOC 2 Type II, HITRUST certification, BAAs); a national retail corporation (PCI Attestation of Compliance, SOC 2, ISO certificates)</li><li>Score vendors using risk matrices aligned to each organization's priorities</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>Due Diligence Checklist — Healthcare (HIPAA-aligned)</div><div class="deliverable"><span class="check">&#x2705;</span>Due Diligence Checklist — Retail (PCI DSS-aligned)</div><div class="deliverable"><span class="check">&#x2705;</span>Simulated Vendor Responses (3 per organization)</div><div class="deliverable"><span class="check">&#x2705;</span>Vendor Risk Scoring Tables (both organizations)</div>`
},
{
  num: 4,
  title: 'Execution Part 2 — Remediation Planning',
  goal: 'Address high-risk vendor findings with concrete remediation strategies.',
  tasks: `<li>A Major Healthcare Organization — Select 2 high-risk vendors: cloud vendor lacking encryption at rest; medical device vendor without documented IR plan. Recommend controls: MFA, ePHI encryption, annual HIPAA risk assessments, enhanced logging</li><li>a national retail corporation — Select 2 high-risk vendors: logistics partner lacking IR plan; payment vendor missing MFA. Recommend controls: data encryption, PCI DSS segmentation, MFA for vendor portals, stricter audit cycles</li><li>Define risk treatment for each vendor: Mitigate, Transfer, Accept, or Avoid with justification</li><li>Build 30–60 day remediation timelines for all high-risk findings</li><li>Document contractual remediation requirements and escalation procedures</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>Remediation Plan — A Major Healthcare Organization (2 vendors)</div><div class="deliverable"><span class="check">&#x2705;</span>Remediation Plan — a national retail corporation (2 vendors)</div><div class="deliverable"><span class="check">&#x2705;</span>Risk Treatment Worksheets (both organizations)</div><div class="deliverable"><span class="check">&#x2705;</span>Remediation Timelines (30-60 day)</div>`
},
{
  num: 5,
  title: 'Monitoring & Ongoing Vendor Oversight',
  goal: 'Establish continuous compliance tracking and vendor performance oversight.',
  tasks: `<li>Build A Major Healthcare Organization Healthcare Compliance Tracker: HIPAA risk assessment dates, SOC 2/HITRUST renewals, BAA expiration dates, patient safety incident log</li><li>Build a national retail corporation Compliance Tracker: PCI DSS renewal dates, SOC 2 report status, logistics vendor certifications, SLA performance metrics</li><li>Design TPRM KPI Dashboard for each organization: % vendors compliant, high-risk vendors open, overdue remediation items, average resolution time</li><li>Review vendor contracts for both organizations: breach notification timelines, data ownership clauses, right-to-audit, SLA penalties</li><li>Recommend contract improvements for both organizations based on identified gaps</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>KPI Dashboard — A Major Healthcare Organization TPRM</div><div class="deliverable"><span class="check">&#x2705;</span>KPI Dashboard — Retail Organization TPRM</div><div class="deliverable"><span class="check">&#x2705;</span>Compliance Trackers (both organizations)</div><div class="deliverable"><span class="check">&#x2705;</span>Contract Improvement Reports (both organizations)</div>`
},
{
  num: 6,
  title: 'Closure — Executive Presentations & Lessons Learned',
  goal: 'Present findings to hospital and retail leadership; document lessons learned.',
  tasks: `<li>Write Final TPRM Report for A Major Healthcare Organization: vendor risks identified, HIPAA gaps, remediation status, recommendations for ongoing program maturity</li><li>Write Final TPRM Report for a national retail corporation: vendor risks, PCI DSS supply chain gaps, remediation status, recommendations</li><li>Prepare 5-slide executive presentations for each organization: risk summary, compliance posture, top findings, remediation roadmap, program improvements</li><li>Recommend process improvements: stronger vendor onboarding workflows, automated monitoring tools (Eramba, Archer), secure vendor offboarding procedures</li><li>Reflect on cross-sector lessons: differences in healthcare (patient safety focus) vs. retail (PCI DSS, supply chain scale) TPRM approaches</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>Final TPRM Report — A Major Healthcare Organization</div><div class="deliverable"><span class="check">&#x2705;</span>Final TPRM Report — a national retail corporation</div><div class="deliverable"><span class="check">&#x2705;</span>Executive Presentation Decks (both organizations)</div><div class="deliverable"><span class="check">&#x2705;</span>Vendor Risk Improvement Checklists (both organizations)</div>`
}];

let current = 0; // 0 = intro, 1–6 = weeks

function renderIntro() {
  const weekList = weeks.map((w,i) => `
    <div class="intro-week" onclick="goTo(${i+1})">
      <div class="intro-week-num">Week ${i+1}</div>
      <div class="intro-week-title">${w.title}</div>
    </div>`).join('');
  return `
    <div class="intro-slide">
      <div class="intro-badge">6-Week Internship Project</div>
      <div class="intro-title">${TITLE}</div>
      <div class="intro-sub">${SUBTITLE}</div>
      <div class="intro-chips">
        <span class="intro-chip">&#x1F4CB; ${FRAMEWORK}</span>
        <span class="intro-chip">&#x1F3E2; ${COMPANY}</span>
        <span class="intro-chip">&#x1F4CC; ${SECTOR}</span>
        <span class="intro-chip">&#x23F1; 6 Weeks</span>
      </div>
      <div class="intro-weeks">${weekList}</div>
      <button class="start-btn" onclick="goTo(1)">Begin Walkthrough &#x2192;</button>
    </div>`;
}

function renderWeek(w) {
  return `
    <div class="meta-bar">
      <div class="meta-item"><span class="meta-label">Framework</span>&nbsp;<span class="meta-chip">${FRAMEWORK}</span></div>
      <div class="meta-item"><span class="meta-label">Organization</span>&nbsp;<span class="meta-value">${COMPANY}</span></div>
      <div class="meta-item"><span class="meta-label">Sector</span>&nbsp;<span class="meta-value">${SECTOR}</span></div>
    </div>
    <div class="week-header">
      <div class="week-badge">&#x1F4C5; Week ${w.num} of 6</div>
      <div class="week-title">${w.title}</div>
      <div class="week-goal">&#x1F3AF; Goal: ${w.goal}</div>
    </div>
    <div class="content-grid">
      <div class="content-card">
        <div class="card-label">Tasks &amp; Activities</div>
        <ul class="task-list">${w.tasks}</ul>
      </div>
      <div class="content-card">
        <div class="card-label">Week ${w.num} Deliverables</div>
        ${w.deliverables}
      </div>
    </div>
    <div class="nav-arrows">
      <button class="nav-btn" onclick="goTo(${current-1})" ${current===1?'disabled':''}>&#x2190; Previous</button>
      ${current < weeks.length
        ? `<button class="nav-btn primary" onclick="goTo(${current+1})">Next Week &#x2192;</button>`
        : `<button class="nav-btn primary" onclick="goTo(0)">&#x2713; Wrap Up &amp; Overview</button>`
      }
    </div>`;
}

function goTo(n) {
  current = n;
  const total = weeks.length;
  const pct = current === 0 ? 0 : Math.round((current / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('weekCounter').textContent = current === 0 ? 'Overview' : `Week ${current} / ${total}`;
  document.getElementById('slideContent').innerHTML = current === 0 ? renderIntro() : renderWeek(weeks[current-1]);
  // dots
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d,i) => d.classList.toggle('active', i+1 === current));
  window.scrollTo({top:0, behavior:'smooth'});
}

// Build dots
const dotsEl = document.getElementById('weekDots');
weeks.forEach((w,i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.textContent = i+1;
  d.title = w.title;
  d.onclick = () => goTo(i+1);
  dotsEl.appendChild(d);
});

// Init
goTo(0);
</script>
</body></html>
