<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mastercard PCI DSS Compliance — Walkthrough</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg: #0c0d0f; --panel: #181c22; --border: #2a3040; --surface: #131519;
    --gold: #c9a84c; --gold-dim: rgba(201,168,76,0.15);
    --accent: #e05c5c;
    --accent-dim: #e05c5c22;
    --text: #edeae0; --muted: #7a8090;
    --headline: 'Syne', sans-serif; --body: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(201,168,76,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.02) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  /* TOP BAR */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(12,13,15,0.94); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .back-btn {
    color: var(--gold); text-decoration: none; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3);
    padding: 4px 12px; border-radius: 20px; transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(201,168,76,0.25); }
  .topbar-title { font-family: var(--headline); font-size: 14px; font-weight: 700; color: var(--text); }
  .topbar-sub { font-size: 11px; color: var(--muted); }
  .week-counter { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--accent); }

  /* PROGRESS BAR */
  .progress-bar {
    position: fixed; top: 56px; left: 0; right: 0; z-index: 99;
    height: 3px; background: var(--border);
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent));
    transition: width 0.4s ease;
  }

  /* WEEK DOTS */
  .week-dots {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 100;
    background: rgba(12,13,15,0.8); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 30px; backdrop-filter: blur(10px);
  }
  .dot {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: var(--muted); cursor: pointer;
    transition: all 0.2s; font-family: var(--headline);
  }
  .dot.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .dot:hover { border-color: var(--accent); color: var(--accent); }

  /* SLIDE */
  .slide-wrap { padding: 80px 32px 100px; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
  .slide { max-width: 900px; width: 100%; position: relative; z-index: 1; }

  /* WEEK HEADER */
  .week-header { margin-bottom: 36px; }
  .week-badge {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px;
    background: var(--accent-dim); border: 1px solid var(--accent)55;
    color: var(--accent); padding: 5px 14px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .week-title { font-family: var(--headline); font-size: clamp(26px,4vw,42px); font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 10px; color: var(--text); }
  .week-goal {
    font-size: 15px; color: #b8a87a; font-style: italic; line-height: 1.6;
    border-left: 2px solid var(--gold); padding-left: 14px; max-width: 680px;
  }

  /* CONTENT GRID */
  .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .content-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; position: relative; overflow: hidden;
  }
  .content-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--gold), var(--accent)); }
  .card-label { font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .task-list { list-style: none; }
  .task-list li { font-size: 13px; color: var(--muted); padding: 7px 0; border-bottom: 1px solid rgba(42,48,64,0.5); line-height: 1.5; display: flex; align-items: flex-start; gap: 8px; }
  .task-list li:last-child { border-bottom: none; }
  .task-list li::before { content: '›'; color: var(--accent); font-size: 16px; font-weight: 700; flex-shrink: 0; margin-top: -1px; }

  .deliverable { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(42,48,64,0.5); font-size: 13px; color: var(--muted); line-height: 1.5; }
  .deliverable:last-child { border-bottom: none; }
  .check { font-size: 14px; flex-shrink: 0; }

  /* META BAR */
  .meta-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 20px; display: flex; gap: 24px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
  }
  .meta-item { display: flex; align-items: center; gap: 8px; }
  .meta-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .meta-value { font-size: 12px; color: var(--text); font-weight: 600; }
  .meta-chip { background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3); color: var(--gold); padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }

  /* NAV ARROWS */
  .nav-arrows { display: flex; gap: 12px; margin-top: 32px; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    font-family: var(--body); transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn.primary { background: var(--gold-dim); border-color: rgba(201,168,76,0.4); color: var(--gold); }
  .nav-btn.primary:hover { background: rgba(201,168,76,0.25); }

  /* INTRO SLIDE */
  .intro-slide { text-align: center; padding: 48px 0; }
  .intro-badge {
    display: inline-block; margin-bottom: 24px;
    background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.35); color: var(--gold);
    padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .intro-title { font-family: var(--headline); font-size: clamp(32px,5vw,56px); font-weight: 800; letter-spacing: -2px; line-height: 1.05; margin-bottom: 16px;
    background: linear-gradient(135deg, #edeae0 0%, #c9a84c 50%, #e05c5c 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .intro-sub { font-size: 16px; color: var(--muted); max-width: 560px; margin: 0 auto 32px; line-height: 1.7; }
  .intro-chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 36px; }
  .intro-chip { background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .intro-weeks { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; max-width: 640px; margin: 0 auto 36px; }
  .intro-week { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: left; cursor: pointer; transition: border-color 0.2s; }
  .intro-week:hover { border-color: var(--gold); }
  .intro-week-num { font-size: 10px; color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .intro-week-title { font-size: 12px; color: var(--text); font-weight: 600; }
  .start-btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 12px 28px;
    background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.4); color: var(--gold);
    border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: var(--body); transition: all 0.2s; text-decoration: none;
  }
  .start-btn:hover { background: rgba(201,168,76,0.25); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-btn">&#x2190; Portfolio</a>
    <div>
      <div class="topbar-title">Mastercard PCI DSS Compliance</div>
      <div class="topbar-sub">PCI DSS v4.0 &middot; Mastercard Global</div>
    </div>
  </div>
  <div class="week-counter" id="weekCounter">Overview</div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="slide-wrap" id="slideWrap">
  <div class="slide" id="slideContent">
    <!-- rendered by JS -->
  </div>
</div>

<div class="week-dots" id="weekDots"></div>

<script>
const TITLE = 'Mastercard PCI DSS Compliance';
const SUBTITLE = "Securing Mastercard's card network, authorization APIs, and tokenization platform to PCI DSS standards";
const FRAMEWORK = 'PCI DSS v4.0';
const COMPANY = 'Mastercard Global';
const SECTOR = 'Financial Services';

const weeks = [{
  num: 1,
  title: 'Governance & CDE Scoping',
  goal: "Define Mastercard's Cardholder Data Environment (CDE) and compliance ownership.",
  tasks: `<li>Use PCI DSS Scoping Guide to define Mastercard's CDE components: authorization & switching systems, network APIs, tokenization & cryptographic services</li><li>Exclude non-CDE systems: HR, marketing, analytics, corporate IT</li><li>Create CHD data flow diagram: Merchant → Acquirer → Mastercard Network → Issuer, highlighting encryption points and tokenization boundaries</li><li>Segment systems: core network processing, token vaults, API gateways — prevent lateral movement from non-CDE</li><li>Document PCI DSS Role Matrix: Network Security Engineer, Cryptography Lead, PCI Compliance Manager, IR Coordinator</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>Mastercard CDE Diagram</div><div class="deliverable"><span class="check">&#x2705;</span>PCI DSS Scoping Summary</div><div class="deliverable"><span class="check">&#x2705;</span>Roles & Responsibility Matrix</div>`
},
{
  num: 2,
  title: 'Gap Analysis & Risk Assessment',
  goal: "Identify PCI DSS gaps across Mastercard's network and APIs.",
  tasks: `<li>Perform gap assessment using PCI DSS Gap Assessment Template: network encryption, API auth, tokenization lifecycle, key management (HSM)</li><li>Categorize risks: Unencrypted CHD transmission → High; Weak API authentication → High; Incomplete token lifecycle tracking → Medium</li><li>Review existing policies: cryptographic key management, API security standards, network segmentation documentation</li><li>Draft remediation plan: AES-256 encryption, mutual TLS for APIs, key rotation policies</li><li>Document residual risk and assign remediation owners with target dates</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>PCI DSS Gap Analysis Table</div><div class="deliverable"><span class="check">&#x2705;</span>Risk Register</div><div class="deliverable"><span class="check">&#x2705;</span>Draft Remediation Action Plan</div>`
},
{
  num: 3,
  title: 'Technical Control Implementation',
  goal: 'Secure Mastercard APIs, networks, and tokenization services.',
  tasks: `<li>Harden API security: enforce mTLS (mutual TLS), OAuth 2.0 / API certificates, rate limiting & anomaly detection</li><li>Implement tokenization controls: real-time PAN tokenization, irreversible token design, secure HSM-protected token vaults</li><li>Configure network firewalls: restrict access to trusted partners, isolate tokenization systems, validate segmentation per PCI DSS</li><li>Validate system configurations using PCI DSS Evidence Checklist</li><li>Document all configuration changes with before/after evidence screenshots</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>API Security Configuration Sheet</div><div class="deliverable"><span class="check">&#x2705;</span>Tokenization Architecture Overview</div><div class="deliverable"><span class="check">&#x2705;</span>Updated Network Firewall Rules Documentation</div>`
},
{
  num: 4,
  title: 'Access Control & Monitoring',
  goal: 'Control and monitor access to cardholder data and tokenized data.',
  tasks: `<li>Define RBAC access levels: network operations, tokenization engineers, compliance & audit teams — apply least privilege</li><li>Enforce MFA for: admin access, network engineers, API management platforms</li><li>Configure centralized logging in SIEM (Splunk/QRadar/ELK): API requests, cryptographic key usage, authentication failures</li><li>Implement daily log review procedures: detect unauthorized access, anomalous traffic, token misuse</li><li>Document access control matrix with approval workflows and review schedule</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>Access Control Matrix</div><div class="deliverable"><span class="check">&#x2705;</span>Log Review & Monitoring Procedure</div><div class="deliverable"><span class="check">&#x2705;</span>MFA Implementation Plan</div>`
},
{
  num: 5,
  title: 'Security Testing & Incident Response',
  goal: 'Validate controls and prepare Mastercard for security incidents.',
  tasks: `<li>Simulate penetration test against network APIs and token services (Burp Suite, API security scanners): test authentication bypass, token leakage, improper error handling</li><li>Develop Incident Response Plan: detection & alerting, network isolation, card brand notification, regulatory reporting</li><li>Run incident simulation: Compromised API credentials used to access tokenization service — walk through Detection → Containment → Communication → Recovery</li><li>Document lessons learned and update IR procedures based on simulation findings</li><li>Review PCI DSS Requirement 12.10 incident response plan obligations</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>Pen Test Summary Report</div><div class="deliverable"><span class="check">&#x2705;</span>Incident Response Plan (PCI-aligned)</div><div class="deliverable"><span class="check">&#x2705;</span>Incident Simulation After-Action Report</div>`
},
{
  num: 6,
  title: 'Final Validation & QSA Readiness',
  goal: 'Prepare Mastercard for PCI DSS QSA (Qualified Security Assessor) assessment.',
  tasks: `<li>Validate closure of all Week 2 gaps: confirm encryption, tokenization controls, access logging all operational</li><li>Compile QSA Evidence Binder: API security configs, tokenization logic documentation, HSM & encryption evidence, log samples, updated IRP & policies</li><li>Organize documentation by PCI DSS requirement, system component, and control owner</li><li>Produce Final PCI Compliance Checklist covering all applicable requirements</li><li>Write Executive Summary Report for Mastercard leadership: compliance journey, control highlights, residual risks, and continuous compliance roadmap</li>`,
  deliverables: `<div class="deliverable"><span class="check">&#x2705;</span>Final PCI DSS Compliance Checklist</div><div class="deliverable"><span class="check">&#x2705;</span>QSA Evidence Binder Index</div><div class="deliverable"><span class="check">&#x2705;</span>Executive Summary Report</div>`
}];

let current = 0; // 0 = intro, 1–6 = weeks

function renderIntro() {
  const weekList = weeks.map((w,i) => `
    <div class="intro-week" onclick="goTo(${i+1})">
      <div class="intro-week-num">Week ${i+1}</div>
      <div class="intro-week-title">${w.title}</div>
    </div>`).join('');
  return `
    <div class="intro-slide">
      <div class="intro-badge">6-Week Internship Project</div>
      <div class="intro-title">${TITLE}</div>
      <div class="intro-sub">${SUBTITLE}</div>
      <div class="intro-chips">
        <span class="intro-chip">&#x1F4CB; ${FRAMEWORK}</span>
        <span class="intro-chip">&#x1F3E2; ${COMPANY}</span>
        <span class="intro-chip">&#x1F4CC; ${SECTOR}</span>
        <span class="intro-chip">&#x23F1; 6 Weeks</span>
      </div>
      <div class="intro-weeks">${weekList}</div>
      <button class="start-btn" onclick="goTo(1)">Begin Walkthrough &#x2192;</button>
    </div>`;
}

function renderWeek(w) {
  return `
    <div class="meta-bar">
      <div class="meta-item"><span class="meta-label">Framework</span>&nbsp;<span class="meta-chip">${FRAMEWORK}</span></div>
      <div class="meta-item"><span class="meta-label">Organization</span>&nbsp;<span class="meta-value">${COMPANY}</span></div>
      <div class="meta-item"><span class="meta-label">Sector</span>&nbsp;<span class="meta-value">${SECTOR}</span></div>
    </div>
    <div class="week-header">
      <div class="week-badge">&#x1F4C5; Week ${w.num} of 6</div>
      <div class="week-title">${w.title}</div>
      <div class="week-goal">&#x1F3AF; Goal: ${w.goal}</div>
    </div>
    <div class="content-grid">
      <div class="content-card">
        <div class="card-label">Tasks &amp; Activities</div>
        <ul class="task-list">${w.tasks}</ul>
      </div>
      <div class="content-card">
        <div class="card-label">Week ${w.num} Deliverables</div>
        ${w.deliverables}
      </div>
    </div>
    <div class="nav-arrows">
      <button class="nav-btn" onclick="goTo(${current-1})" ${current===1?'disabled':''}>&#x2190; Previous</button>
      ${current < weeks.length
        ? `<button class="nav-btn primary" onclick="goTo(${current+1})">Next Week &#x2192;</button>`
        : `<button class="nav-btn primary" onclick="goTo(0)">&#x2713; Wrap Up &amp; Overview</button>`
      }
    </div>`;
}

function goTo(n) {
  current = n;
  const total = weeks.length;
  const pct = current === 0 ? 0 : Math.round((current / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('weekCounter').textContent = current === 0 ? 'Overview' : `Week ${current} / ${total}`;
  document.getElementById('slideContent').innerHTML = current === 0 ? renderIntro() : renderWeek(weeks[current-1]);
  // dots
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d,i) => d.classList.toggle('active', i+1 === current));
  window.scrollTo({top:0, behavior:'smooth'});
}

// Build dots
const dotsEl = document.getElementById('weekDots');
weeks.forEach((w,i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.textContent = i+1;
  d.title = w.title;
  d.onclick = () => goTo(i+1);
  dotsEl.appendChild(d);
});

// Init
goTo(0);
</script>
</body></html>
